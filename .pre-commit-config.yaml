repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        files: \.(tf|tfvars)$
        pass_filenames: false
      - id: ruff-lint
        name: ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: trufflehog
        name: trufflehog (local, no network)
        entry: trufflehog git file://. --since-commit HEAD --no-verification --fail
        language: system
        pass_filenames: false